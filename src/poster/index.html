<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケアリ ポップ＆キュート宣伝ポスター集（A4 PDFプレビュー）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px 60px;
    }

    .header-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 12px 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .title-area h1 {
      font-size: 18px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tabs {
      display: flex;
      background: #0f172a;
      border-radius: 9999px;
      padding: 4px;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: #fff;
    }
    .tab-btn.active {
      background: #f59e0b;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }
    .btn-pdf {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
      transition: transform 0.15s ease;
    }
    .btn-pdf:hover {
      transform: translateY(-2px);
    }
    .btn-fullscreen {
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 800;
    }

    .preview-container {
      width: 100%;
      max-width: 820px;
      height: 1160px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      border: 4px solid #1e293b;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .footer-note b {
      color: #facc15;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-area">
      <h1><span>⚡</span> ポケアリ かわいい宣伝ポスター</h1>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('a')">💛 パターンA (ピカチュウ＆イーブイ)</button>
      <button class="tab-btn" onclick="switchTab('b')">💖 パターンB (プリン＆パステル)</button>
      <button class="tab-btn" onclick="switchTab('c')">💙 パターンC (ポッチャマ＆フェス)</button>
    </div>

    <div class="action-btns">
      <a id="btn-pdf-link" href="poster_pattern_a.pdf" target="_blank" class="btn-pdf">
        📥 選択中PDFを直接開く / 保存
      </a>
      <a id="btn-full-link" href="poster-a.html" target="_blank" class="btn-fullscreen">
        🔍 HTML全画面
      </a>
    </div>
  </div>

  <div class="preview-container">
    <iframe id="preview-frame" src="poster-a.html"></iframe>
  </div>

  <div class="footer-note">
    💡 印刷するときは各PDFをダウンロードするか、全画面表示から <b>Ctrl + P（印刷）</b> で「PDFに保存」を選んでください。
  </div>

  <script>
    function switchTab(type) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const frame = document.getElementById('preview-frame');
      const pdfLink = document.getElementById('btn-pdf-link');
      const fullLink = document.getElementById('btn-full-link');

      if (type === 'a') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        frame.src = 'poster-a.html';
        pdfLink.href = 'poster_pattern_a.pdf';
        fullLink.href = 'poster-a.html';
      } else if (type === 'b') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        frame.src = 'poster-b.html';
        pdfLink.href = 'poster_pattern_b.pdf';
        fullLink.href = 'poster-b.html';
      } else if (type === 'c') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        frame.src = 'poster-c.html';
        pdfLink.href = 'poster_pattern_c.pdf';
        fullLink.href = 'poster-c.html';
      }
    }
  </script>
</body>
</html>
